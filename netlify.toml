[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.0"

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
  force = false

[[redirects]]
  from = "/dashboard"
  to = "/internal.html"
  status = 200

[[redirects]]
  from = "/member-management"
  to = "/internal.html"
  status = 200

[[redirects]]
  from = "/centers"
  to = "/internal.html"
  status = 200

[[redirects]]
  from = "/collections"
  to = "/internal.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/internal.html"
  status = 200

[[redirects]]
  from = "/transactions"
  to = "/internal.html"
  status = 200

[[redirects]]
  from = "/admin/users"
  to = "/internal.html"
  status = 200

[[redirects]]
  from = "/approvals"
  to = "/internal.html"
  status = 200

[[redirects]]
  from = "/waivers"
  to = "/internal.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false
